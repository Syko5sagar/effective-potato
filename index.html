<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-container {
            width: 100%;
            max-width: 450px;
            background-color: #000000;
            padding: 25px 20px;
            border: 1px solid #262626;
            border-radius: 12px;
        }

        .header-section {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .profile-pic-container {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid #1c2732;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 25px;
            flex-shrink: 0;
            background-color: #121212;
        }

        .profile-pic {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
        }

        .right-details {
            flex-grow: 1;
        }

        .profile-name-row {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        .stats-container {
            display: flex;
            gap: 28px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-num {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            display: block;
        }

        .stat-text {
            font-size: 14px;
            color: #ffffff;
        }

        .bio-section {
            padding-left: 5px;
            font-size: 15px;
            line-height: 1.5;
            color: #ffffff;
        }

        .bio-row {
            margin-bottom: 4px;
        }

        .gray-text {
            color: #a8a8a8;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="header-section">
            <div class="profile-pic-container">
                <!-- ನೀವು ಕಳುಹಿಸಿದ ಫೋಟೋದ ನಿಖರವಾದ ಫೈಲ್ ಹೆಸರು -->
                <img class="profile-pic" src="1000201496.jpg" alt="Profile">
            </div>
            
            <div class="right-details">
                <div class="profile-name-row">
                    sheττy💖👀🪄
                </div>
                <div class="stats-container">
                    <div class="stat-box">
                        <span class="stat-num">109</span>
                        <span class="stat-text">posts</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num">8,536</span>
                        <span class="stat-text">followers</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num">246</span>
                        <span class="stat-text">friends</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bio-section">
            <div class="bio-row">Inocent girl 💕👼</div>
            <div class="bio-row">Hassan hudgi ✨</div>
            <div class="bio-row">My land 13 January 👑</div>
            <div class="bio-row">My Life my ... <span class="gray-text">more</span></div>
        </div>
    </div>

</body>
</html>
