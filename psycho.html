<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Account</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding-top: 50px; overflow: hidden; position: relative; }

        /* Confetti Canvas - ಹಿನ್ನೆಲೆಯಲ್ಲಿ */
        #confetti-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        .profile-container { width: 100%; max-width: 450px; background-color: #000000; padding: 20px; border: 1px solid #262626; border-radius: 12px; position: relative; z-index: 2; }

        .header-section { display: flex; align-items: center; margin-bottom: 20px; }
        .profile-pic-container { width: 85px; height: 85px; border-radius: 50%; border: 2px solid #262626; margin-right: 20px; overflow: hidden; }
        .profile-pic { width: 100%; height: 100%; object-fit: cover; }

        .name-wrapper { display: flex; align-items: center; gap: 5px; }
        .profile-name { font-size: 18px; font-weight: 600; }
        .blue-tick { width: 16px; height: 16px; fill: #0095f6; }

        .stats-container { display: flex; gap: 20px; margin-top: 10px; }
        .stat-box { text-align: center; }
        .stat-num { font-weight: 700; display: block; }
        .stat-text { font-size: 13px; color: #a8a8a8; }

        .success-box { margin-top: 30px; text-align: center; border-top: 1px solid #262626; padding-top: 20px; }
        .msg-title { color: #0095f6; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .msg-text { color: #ffffff; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="profile-container">
        <div class="header-section">
            <div class="profile-pic-container">
                <img class="profile-pic" src="./Screenshot_20260607_220046.jpg" alt="Profile">
            </div>
            <div class="right-details">
                <div class="name-wrapper">
                    <div class="profile-name">ll___dhanu___shetty___ll</div>
                    <svg class="blue-tick" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.99 15l-4.07-4.07 1.41-1.41 2.66 2.66 5.66-5.66 1.41 1.41-7.07 7.07z"/></svg>
                </div>
                <div class="stats-container">
                    <div class="stat-box"><span class="stat-num">109</span><span class="stat-text">posts</span></div>
                    <div class="stat-box"><span class="stat-num">8,536</span><span class="stat-text">followers</span></div>
                    <div class="stat-box"><span class="stat-num">246</span><span class="stat-text">following</span></div>
                </div>
            </div>
        </div>

        <div class="success-box">
            <div class="msg-title">Congratulations!</div>
            <div class="msg-text">
                Successfully verified account.<br>
                Please check your Instagram profile after 24 hours.
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        let particles = [];
        for(let i=0; i<150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 8 + 2,
                speedY: Math.random() * 2 + 1,
                speedX: Math.random() * 2 - 1,
                color: ['#0095f6', '#ffffff', '#ff0055'][Math.floor(Math.random()*3)],
                angle: Math.random() * 360
            });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                // ಚೌಕಾಕಾರ ಅಥವಾ ಆಯತಾಕಾರದ ಪೇಪರ್ ತುಣುಕುಗಳು
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();
                p.y -= p.speedY;
                p.x += p.speedX;
                p.angle += 0.05;
                if(p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
